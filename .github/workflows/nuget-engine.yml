name: CD-Engine

on:
  push:
    tags:
    - 'cofuse-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, e.g. 4.1.0-fuse.5
        required: true
        type: string
      publish:
        description: Push to NuGet
        required: false
        type: boolean
        default: false
  
env:
  PACKAGE_DIRECTORY: ${{ github.workspace }}/output

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      working-directory: ./
      run: dotnet restore

    - name: Set VERSION from input or git tag
      id: version
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          VERSION="${{ inputs.version }}"
        else
          VERSION="${GITHUB_REF_NAME#cofuse-v}"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
        echo "value=${VERSION}" >> $GITHUB_OUTPUT

    - name: Set FILE_VER from VERSION
      run: |
        echo VERSION: ${VERSION}
        echo "FILE_VER=${VERSION%\-*}" >> $GITHUB_ENV     # remove suffix e.g. '-preview.1'

    - name: Echo versions
      run: |
        echo package version: ${VERSION} FILE_VER: ${FILE_VER}

    - name: Build
      working-directory: ./
      run: |
        echo "GITHUB_ACTIONS=true" >> $GITHUB_ENV
        dotnet build --no-restore /p:Version=${FILE_VER} /p:FileVersion=${FILE_VER} /p:AssemblyVersion=${FILE_VER} -c Release

    - name: Test
      working-directory: ./
      run: dotnet test --no-build --verbosity normal -c Release

    - name: Pack
      working-directory: ./
      run: dotnet pack --no-restore --no-build -p:PackageVersion=${VERSION} -p:SymbolPackageFormat=snupkg -p:PackageOutputPath=${{ env.PACKAGE_DIRECTORY }} -c Release

    - uses: actions/upload-artifact@v7
      with:
        name: packages
        path: ${{ env.PACKAGE_DIRECTORY }}

  publish:
    needs: build
    if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/cofuse-v') }}

    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - uses: actions/download-artifact@v8
      with:
        name: packages
        path: ${{ env.PACKAGE_DIRECTORY }}

    - uses: NuGet/login@v1
      id: login
      with:
        user: vrimar

    - name: Push
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        dotnet nuget push ${{ env.PACKAGE_DIRECTORY }}/CoFuse.Engine.ECS.Boost.${VERSION}.nupkg  --source https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY" --skip-duplicate
        dotnet nuget push ${{ env.PACKAGE_DIRECTORY }}/CoFuse.Engine.ECS.${VERSION}.nupkg        --source https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY" --skip-duplicate

    
