name: CI-Engine

on:
  push:
    branches: [ fuse ]
  pull_request:
    branches: [ fuse ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      working-directory: ./
      run: dotnet restore

    - name: Build
      working-directory: ./
      run: dotnet build --no-restore

    - name: Test
      working-directory: ./
      run: dotnet test --no-build --verbosity normal

    # Tests-NativeAOT uses Microsoft.Testing.Platform, which 'dotnet test' does not discover
    - name: Test NativeAOT
      working-directory: ./
      run: dotnet run --project src/Tests-NativeAOT/Tests-NativeAOT.csproj --no-build

  aot:

    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # 'dotnet run' is JIT; only a published image trims the way a NativeAOT consumer does
    - name: Publish and run NativeAOT tests
      working-directory: ./
      run: |
        for project in Tests-NativeAOT Tests-NativeAOT-Struct; do
          dotnet publish src/$project/$project.csproj -r linux-x64 -c Release -p:StackTraceSupport=false -o out/$project
          out/$project/$project
        done




    